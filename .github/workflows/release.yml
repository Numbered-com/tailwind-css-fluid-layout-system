name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write # GitHub release
  id-token: write # npm trusted publishing

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: oven-sh/setup-bun@v2
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
      - run: npm install -g npm@latest # trusted publishing needs npm >= 11.5.1
      - run: bun install --frozen-lockfile
      - run: bun test

      - name: Check tag matches package.json
        run: test "${GITHUB_REF_NAME#v}" = "$(node -p 'require("./package.json").version')"

      - name: Publish to npm
        run: |
          if npm view "$(node -p 'require("./package.json").name')@${GITHUB_REF_NAME#v}" version 2>/dev/null | grep -q .; then
            echo "Already on npm, skipping"
          else
            npm publish
          fi

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          awk -v v="${GITHUB_REF_NAME#v}" '/^## \[/{f=index($0,"["v"]")} f&&!/^## \[/' CHANGELOG.md > notes.md
          gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1 || gh release create "$GITHUB_REF_NAME" --title "$GITHUB_REF_NAME" --notes-file notes.md

      # The website serves the skill from its installed plugin, so each release redeploys it.
      - uses: actions/checkout@v5
        with:
          repository: Numbered-com/tailwind-css-fluid-layout-system-landing
          ssh-key: ${{ secrets.LANDING_DEPLOY_KEY }} # read-write deploy key on the landing repo
          path: landing

      - name: Bump the plugin on the website
        working-directory: landing
        run: |
          # A fresh publish takes a moment to reach the registry: retry for up to 5 minutes, skipping bun's manifest cache so retries see it.
          until bun add --no-cache "@numbered/tailwind-fluid-layout-system@^${GITHUB_REF_NAME#v}"; do
            (( ++tries < 30 )) || exit 1
            sleep 10
          done
          git diff --quiet && exit 0
          git config user.name "github-actions[bot]"
          git config user.email "41898283+github-actions[bot]@users.noreply.github.com"
          git commit -am "deps: @numbered/tailwind-fluid-layout-system ${GITHUB_REF_NAME}"
          git push
